<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сикаку</title>

  <script>
    (function () {
      var theme = "dark";

      try {
        var storedTheme = localStorage.getItem("shikaku-theme");
        if (storedTheme === "light" || storedTheme === "dark") {
          theme = storedTheme;
        }
      } catch (error) {
        theme = "dark";
      }

      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <style>
    :root,
    :root[data-theme="dark"] {
      color-scheme: dark;

      --accent-1: rgba(59, 130, 246, 0.18);
      --accent-2: rgba(16, 185, 129, 0.14);

      --bg-1: #0f172a;
      --bg-2: #020617;

      --card-bg: rgba(15, 23, 42, 0.72);
      --card-border: rgba(148, 163, 184, 0.16);
      --card-shadow: 0 20px 60px rgba(2, 6, 23, 0.55);

      --title: #f8fafc;
      --subtitle: #94a3b8;
      --status: #cbd5e1;

      --control-bg: rgba(15, 23, 42, 0.9);
      --control-border: rgba(148, 163, 184, 0.22);
      --control-text: #e2e8f0;
      --control-hover-shadow: 0 6px 18px rgba(2, 6, 23, 0.35);

      --primary-bg: #e2e8f0;
      --primary-text: #0f172a;
      --primary-border: #cbd5e1;

      --canvas-shadow:
        inset 0 0 0 1px rgba(148, 163, 184, 0.10),
        0 10px 30px rgba(2, 6, 23, 0.35);
    }

    :root[data-theme="light"] {
      color-scheme: light;

      --accent-1: rgba(59, 130, 246, 0.14);
      --accent-2: rgba(16, 185, 129, 0.12);

      --bg-1: #eef2ff;
      --bg-2: #f8fafc;

      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(255, 255, 255, 0.5);
      --card-shadow: 0 20px 60px rgba(15, 23, 42, 0.14);

      --title: #0f172a;
      --subtitle: #475569;
      --status: #334155;

      --control-bg: rgba(255, 255, 255, 0.92);
      --control-border: rgba(15, 23, 42, 0.12);
      --control-text: #0f172a;
      --control-hover-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);

      --primary-bg: #0f172a;
      --primary-text: #ffffff;
      --primary-border: #0f172a;

      --canvas-shadow:
        inset 0 0 0 1px rgba(15, 23, 42, 0.06),
        0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--control-text);
      background:
        radial-gradient(circle at 15% 15%, var(--accent-1), transparent 30%),
        radial-gradient(circle at 85% 20%, var(--accent-2), transparent 28%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .app {
      position: relative;
      width: min(94vw, 640px);
      padding: 20px;
      border-radius: 24px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      box-shadow: var(--card-shadow);
      border: 1px solid var(--card-border);
    }

    h1 {
      margin: 0;
      color: var(--title);
      font-size: 28px;
      padding-right: 52px;
    }

    .subtitle {
      margin: 8px 0 14px;
      color: var(--subtitle);
      line-height: 1.4;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    select,
    button {
      appearance: none;
      border: 1px solid var(--control-border);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      color: var(--control-text);
      background: var(--control-bg);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      transition:
        transform 120ms ease,
        box-shadow 120ms ease,
        opacity 120ms ease;
    }

    select:hover,
    button:hover {
      transform: translateY(-1px);
      box-shadow: var(--control-hover-shadow);
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background: var(--primary-bg);
      color: var(--primary-text);
      border-color: var(--primary-border);
    }

    select option {
      background-color: var(--control-bg);
      color: var(--control-text);
    }

    .theme-toggle {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      z-index: 2;
    }

    .theme-toggle:hover {
      transform: translateY(-1px) scale(1.03);
    }

    .theme-toggle:active {
      transform: translateY(0) scale(0.99);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      display: none;
      pointer-events: none;
    }

    :root[data-theme="dark"] .icon-sun {
      display: block;
    }

    :root[data-theme="dark"] .icon-moon {
      display: none;
    }

    :root[data-theme="light"] .icon-sun {
      display: none;
    }

    :root[data-theme="light"] .icon-moon {
      display: block;
    }

    .board-wrap {
      display: flex;
      justify-content: center;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      touch-action: none;
      background: transparent;
      box-shadow: var(--canvas-shadow);
      user-select: none;
      -webkit-user-select: none;
    }

    .status {
      margin-top: 12px;
      min-height: 22px;
      font-size: 14px;
      font-weight: 600;
      color: var(--status);
    }

    @media (max-width: 480px) {
      .app {
        padding: 14px;
      }

      h1 {
        font-size: 24px;
        padding-right: 48px;
      }

      select,
      button {
        flex: 1 1 auto;
        text-align: center;
      }

      .theme-toggle {
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
      }
    }
  </style>

  <script src="shikaku.js" defer></script>
</head>
<body>
  <main class="app">
    <button
      id="themeBtn"
      class="theme-toggle"
      type="button"
      aria-label="Переключить тему"
      title="Переключить тему"
    >
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>

      <svg
        class="icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <h1>Сикаку</h1>
    <p class="subtitle">
      Разделите поле на прямоугольники так, чтобы в каждом прямоугольнике было ровно одно число.
      Это число равно площади прямоугольника.
      Нажмите на готовый прямоугольник, чтобы удалить его. Тяните мышью или пальцем, чтобы построить новый.
    </p>

    <div class="toolbar">
      <select id="levelSelect" aria-label="Выбор уровня"></select>

      <select id="sizeSelect" aria-label="Размер случайного поля"></select>

      <button id="randomBtn" class="primary">Новая случайная</button>
      <button id="undoBtn">Отменить</button>
      <button id="clearBtn">Очистить</button>
      <button id="checkBtn">Проверить</button>
    </div>

    <div class="board-wrap">
      <canvas id="game"></canvas>
    </div>

    <div id="status" class="status"></div>
  </main>
</body>
</html>
